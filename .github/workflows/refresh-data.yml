name: Refresh videos and Discord count
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name "fractured-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ignore the timestamp-only change so we don't commit every hour for nothing
          if git diff --quiet -I '"updated"' -- data.json; then echo "no content change"; exit 0; fi
          git add data.json
          git commit -m "Refresh videos and Discord count"
          git push
